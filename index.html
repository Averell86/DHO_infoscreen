<!DOCTYPE html>
<html>
<head>
    <title>Canteen Loop</title>
    <script>
        window.onload = function() {
            // Haal op welke pagina nu aan de beurt is
            let nextPage = localStorage.getItem("next_page") || "projects";
            
            // Jouw Odoo links
            const projectsURL = "https://test-odooquotepic.odoo.com/odoo/employees-planning";
            const planningURL = "https://test-odooquotepic.odoo.com/odoo/action-1099";
            
            // De link van deze GitHub pagina zelf (om naar terug te keren)
            const githubURL = window.location.href; 

            if (nextPage === "projects") {
                localStorage.setItem("next_page", "planning");
                // Stuur naar projecten, en vertel Odoo (indien ondersteund) na 30 sec te herladen
                window.location.replace(projectsURL);
            } else {
                localStorage.setItem("next_page", "projects");
                window.location.replace(planningURL);
            }

            // Mocht de TV browser de pagina niet verlaten, forceer na 5 seconden
            setTimeout(() => {
                window.location.replace(githubURL);
            }, 30000); // 30 seconden
        };
    </script>
</head>
<body>
    Switching dashboards...
</body>
</html>
